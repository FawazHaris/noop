name: Personal i18n patch

on:
  push:
    branches: [feature/personal-v1]
    paths:
      - Tools/personal_i18n_fix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout personal branch
        uses: actions/checkout@v5
        with:
          ref: feature/personal-v1
          fetch-depth: 0

      - name: Apply personal localization entries
        run: python3 Tools/personal_i18n_fix.py

      - name: Commit catalog update
        run: |
          set -euo pipefail
          if git diff --quiet -- Strand/Resources/Localizable.xcstrings; then
            echo "Catalog already up to date."
            exit 0
          fi
          git config user.name "Personal Fork Builder"
          git config user.email "personal-fork-builder@users.noreply.github.com"
          git add Strand/Resources/Localizable.xcstrings
          git commit -m "fix: localize personal V1 strings"
          git push origin HEAD:feature/personal-v1
